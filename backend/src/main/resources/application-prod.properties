# =============================================
# Produktionsprofil: PostgreSQL
# Aktivierung ueber: --spring.profiles.active=prod
# bzw. Umgebungsvariable SPRING_PROFILES_ACTIVE=prod
# =============================================
spring.application.name=alltagshilfe-backend

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:alltagshilfe}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER:alltagshilfe}
spring.datasource.password=${DB_PASSWORD:alltagshilfe}

# "update" statt "create-drop": Schema und Daten bleiben zwischen
# Neustarts erhalten. Der DataInitializer prueft vor dem Anlegen,
# ob die jeweiligen Datensaetze bereits existieren, und legt daher
# bei einem Neustart keine Duplikate an.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2-Konsole im Produktionsprofil deaktivieren
spring.h2.console.enabled=false
