# =============================================
# Anwendungsname
# =============================================
spring.application.name=alltagshilfe-backend

# =============================================
# H2 In-Memory-Datenbank (nur für Entwicklung)
# Beim Neustart der Anwendung werden alle Daten
# zurückgesetzt – der DataInitializer füllt sie
# beim Start automatisch neu.
# =============================================
spring.datasource.url=jdbc:h2:mem:alltagshilfe
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# =============================================
# H2-Konsole aktivieren
# Erreichbar unter: http://localhost:8080/h2-console
# =============================================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# =============================================
# JPA / Hibernate
# create-drop: Tabellen werden beim Start neu
# erstellt und beim Beenden gelöscht.
# =============================================
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
